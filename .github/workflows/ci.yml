name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least-privilege token for all jobs
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check packages/ apps/ scripts/ tests/

      - name: Mypy type-check
        run: mypy --explicit-package-bases packages/ apps/ scripts/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ --cov=packages --cov-report=term-missing -q

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (Python CVEs)
        # Documented exceptions — both tracked in COMPLETION_REPORT, revisit each release:
        #   CVE-2025-3000    torch    — no fixed release published yet.
        #   PYSEC-2026-3625  msgpack  — DoS-only (out-of-bounds read when an Unpacker is
        #     reused after a caught error), fixed in 1.2.1. Cannot upgrade: msgpack is a
        #     transitive dep of fastf1 -> signalrcore, and signalrcore 1.0.2 (latest)
        #     hard-pins msgpack==1.1.2. pip can only satisfy >=1.2.1 by downgrading
        #     signalrcore to 0.8.8, which is a worse trade than the advisory. Not exposed
        #     in production: fastf1/msgpack are local-pipeline only and are absent from
        #     pyproject.toml, which is the dependency set the deployed API installs.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc off \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2026-3625

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (web, high+ only)
        working-directory: apps/web
        run: npm audit --audit-level=high

  build-web:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.racejudge.example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Lighthouse
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.racejudge.example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
