[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racejudge"
version = "0.1.0"
description = "The Stewards' Precedent Engine — F1 stewarding decision pipeline and web platform"
requires-python = ">=3.12"
license = { text = "MIT" }
# Slim runtime set used by the Vercel-deployed API. Heavy ML/pipeline deps
# (sentence-transformers, xgboost, prefect, celery, …) live in requirements.txt
# and are only needed for local pipeline work and the Fly.io image.
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "PyJWT[crypto]>=2.8.0",
    "stripe>=10.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

# Vercel Python runtime: load the FastAPI app from apps/api/main.py
[tool.vercel]
entrypoint = "apps.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

# ---------------------------------------------------------------------------
# Dev tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

# One-off operational scripts are prefixed with "_" (Phase-3 backfills, local
# fine-tunes). They are committed for reproducibility and re-runnability, have
# already been executed against production data, and import optional heavy deps
# (pyannote, fastf1, peft) that CI deliberately does not install. They are held
# to a lower bar than library code — library code under packages/ and apps/ is
# still fully linted.
extend-exclude = ["scripts/_*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["packages"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
# Same rationale as [tool.ruff] extend-exclude — one-off "_"-prefixed scripts.
exclude = ["scripts/_.*\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Workspaces (for IDEs)
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["packages", "scripts"]
pythonVersion = "3.12"
